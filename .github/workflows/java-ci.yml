name: Java CI - Bowling Game (TDD + Quality Gates)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'  # cache dependencies for faster build

      - name: Build + Tests + Checkstyle + PMD
        run: mvn -B verify

      - name: Publish PMD report to PR (code smells & duplicates)
        if: github.event_name == 'pull_request'
        uses: jwgmeligmeyling/pmd-github-action@master
        with:
          path: '**/pmd.xml'  # Maven PMD generates this file automatically
          title: 'PMD Code Quality Report'